spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: gymflow
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        multiTenancy: SCHEMA
  flyway:
    locations: classpath:db/migration/public
    baseline-on-migrate: true
  data:
    web:
      pageable:
        max-page-size: 100

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE

server:
  port: ${PORT}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:28800000}

app:
  timezone: ${APP_TIMEZONE:America/Lima}

security:
  public-paths: /api/auth/login, /api/auth/register-gym, /api/public/**, /swagger-ui/**, /v3/api-docs/**
