<div class="glass-panel rounded-3xl p-8">
  <div class="mb-6 flex items-center gap-3">
    <span
      class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary text-gray-900 shadow-lg shadow-primary/30"
    >
      <app-ui-icon name="scan" class="h-5 w-5" [strokeWidth]="2.2" />
    </span>
    <span class="text-lg font-extrabold text-gray-900">GymFlow</span>
  </div>
  <h1 class="mb-6 text-2xl font-extrabold text-gray-900">Ingresa a tu gimnasio</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
    <div>
      <label class="field-label" for="email">Correo</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        class="field-input"
        formControlName="email"
      />
      @if (err(form.controls.email); as message) {
        <p id="email-error" class="field-error">{{ message }}</p>
      }
    </div>
    <div>
      <label class="field-label" for="password">Contraseña</label>
      <div class="relative">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          class="field-input pr-12"
          formControlName="password"
        />
        <button
          type="button"
          class="btn-icon absolute top-1/2 right-1.5 -translate-y-1/2"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.aria-pressed]="showPassword()"
          (click)="showPassword.set(!showPassword())"
        >
          <app-ui-icon [name]="showPassword() ? 'eyeOff' : 'eye'" class="h-4 w-4" />
        </button>
      </div>
      @if (err(form.controls.password); as message) {
        <p id="password-error" class="field-error">{{ message }}</p>
      }
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="btn btn-primary w-full" [disabled]="saving()">
      {{ saving() ? 'Ingresando…' : 'Ingresar' }}
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-gray-500">
    ¿Tienes un gimnasio nuevo?
    <a routerLink="/registro" class="font-bold text-primary-ink hover:underline">Regístralo</a>
  </p>
</div>
