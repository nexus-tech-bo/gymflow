<div
  class="relative flex h-dvh overflow-hidden bg-gradient-to-b from-[#eef2f7] via-[#f5f7fa] to-[#eef3f6]"
>
  <div class="bg-blob -top-56 -left-28 h-[560px] w-[560px] bg-primary/20"></div>
  <div class="bg-blob top-16 -right-40 h-[520px] w-[520px] bg-secondary/[0.22]"></div>
  <div class="bg-blob -bottom-52 left-1/3 h-[460px] w-[460px] bg-tertiary/[0.13]"></div>

  <div class="relative z-10 mx-auto flex h-full w-full max-w-[1680px] min-w-0">
    <aside
      class="glass-panel my-4 ml-4 hidden w-64 shrink-0 flex-col rounded-3xl p-4 lg:flex"
      aria-label="Menú principal"
    >
      <ng-container [ngTemplateOutlet]="nav" />
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex items-center gap-3 px-4 pt-4 lg:hidden">
        <button
          type="button"
          class="btn-icon glass-panel"
          aria-label="Abrir menú"
          aria-controls="mobile-nav"
          [attr.aria-expanded]="drawerOpen()"
          (click)="drawerOpen.set(true)"
        >
          <app-ui-icon name="menu" class="h-5 w-5" />
        </button>
        <p class="min-w-0 flex-1 truncate text-lg font-extrabold text-gray-900">
          {{ pageTitle() }}
        </p>
        @if (auth.user(); as user) {
          <span class="avatar" [title]="user.fullName" aria-hidden="true">{{
            initials(user.fullName)
          }}</span>
        }
      </header>

      <main class="min-h-0 flex-1 overflow-y-auto px-4 pt-6 pb-8 lg:px-8">
        <router-outlet />
      </main>
    </div>
  </div>

  @if (drawerOpen()) {
    <div class="fixed inset-0 z-40 lg:hidden" (keydown.escape)="drawerOpen.set(false)">
      <div class="glass-backdrop absolute inset-0" (click)="drawerOpen.set(false)"></div>
      <nav
        id="mobile-nav"
        role="dialog"
        aria-modal="true"
        class="glass-modal absolute inset-y-0 left-0 flex w-72 max-w-[85vw] flex-col rounded-r-3xl p-4"
        aria-label="Menú principal"
        cdkTrapFocus
        [cdkTrapFocusAutoCapture]="true"
      >
        <button
          type="button"
          class="btn-icon absolute top-4 right-4"
          aria-label="Cerrar menú"
          (click)="drawerOpen.set(false)"
        >
          <app-ui-icon name="x" class="h-5 w-5" />
        </button>
        <ng-container [ngTemplateOutlet]="nav" />
      </nav>
    </div>
  }
</div>

<ng-template #nav>
  <div class="mb-8 flex items-center gap-3 px-2 pt-1">
    <span
      class="flex h-10 w-10 items-center justify-center rounded-2xl bg-primary text-gray-900 shadow-lg shadow-primary/30"
    >
      <app-ui-icon name="scan" class="h-5 w-5" [strokeWidth]="2.2" />
    </span>
    <span class="text-lg font-extrabold text-gray-900">GymFlow</span>
  </div>

  <ul class="flex flex-1 flex-col gap-1 overflow-y-auto">
    @for (item of navItems(); track item.path) {
      <li>
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/90 !text-primary-ink shadow-md"
          ariaCurrentWhenActive="page"
          class="flex items-center gap-3 rounded-2xl px-4 py-3 text-[15px] font-semibold text-gray-500 hover:bg-white/60 focus-visible:ring-2 focus-visible:ring-primary-ink focus-visible:outline-none"
        >
          <app-ui-icon [name]="item.icon" class="h-[18px] w-[18px]" />
          {{ item.label }}
        </a>
      </li>
    }
  </ul>

  @if (auth.user(); as user) {
    <div class="mt-4 border-t border-gray-900/[0.06] px-2 pt-4">
      <p class="truncate font-bold text-gray-900" [title]="user.fullName">{{ user.fullName }}</p>
      <p class="truncate text-xs font-medium text-gray-500" [title]="user.gymName">
        {{ user.gymName }}
      </p>
      <app-status-chip class="mt-2 block" [chip]="roleChip[user.role]" />
      <button
        type="button"
        class="btn btn-ghost mt-3 w-full justify-start px-2 hover:!text-red-600"
        (click)="auth.logout()"
      >
        <app-ui-icon name="logout" class="h-4 w-4" />
        Cerrar sesión
      </button>
    </div>
  }
</ng-template>
